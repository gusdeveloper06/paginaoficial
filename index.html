<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GusDev | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .nav-active { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border-right: 3px solid #38bdf8; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #mobile-menu { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="flex min-h-screen relative overflow-x-hidden">

    <button onclick="toggleMenu()" class="lg:hidden fixed bottom-6 right-6 z-[100] bg-blue-600 p-4 rounded-2xl shadow-xl text-white">
        <svg id="menu-icon" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>

    <aside id="mobile-menu" class="fixed inset-y-0 left-0 z-[90] w-64 glass-panel border-r border-slate-800 -translate-x-full lg:translate-x-0 lg:sticky lg:flex flex-col h-screen">
        <div class="p-8 mb-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-xl flex items-center justify-center font-bold text-white shadow-lg">G</div>
            <span class="text-xl font-black tracking-tighter italic uppercase">GUS.DEV</span>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="index.html" class="nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-semibold">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                Proyectos
            </a>
            <a href="sobre-mi.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-400 hover:text-white text-sm font-semibold">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Sobre mí
            </a>
        </nav>
        <div class="p-6 mt-auto">
            <div id="status-box" class="glass-panel p-4 rounded-2xl border-dashed border-slate-700 text-center transition-all duration-500">
                <p id="status-text" class="mono text-[10px] font-bold tracking-widest text-slate-500 uppercase italic">Syncing...</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-6 lg:p-12 w-full">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
            <div>
                <h2 class="text-4xl font-extrabold mb-2 italic">Proyectos</h2>
                <p class="text-slate-500 mono text-sm font-bold">Numero de proyectos: <span id="count" class="text-blue-400">0</span></p>
            </div>
            <div class="relative w-full md:w-80">
                <input type="text" id="buscador" onkeyup="filtrar()" placeholder="Search Repository..." 
                    class="w-full glass-panel py-3 px-6 rounded-2xl text-sm focus:outline-none focus:border-blue-500 transition-all">
            </div>
        </header>

        <div id="contenedor-proyectos" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8"></div>
    </main>

    <div id="modal" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="cerrarModal()"></div>
        <div class="glass-panel w-full max-w-4xl rounded-[2.5rem] overflow-hidden relative flex flex-col md:flex-row max-h-[90vh] overflow-y-auto">
            <div class="w-full md:w-1/2 h-56 md:h-auto border-b md:border-b-0 md:border-r border-white/5">
                <img id="modal-captura" src="" class="w-full h-full object-cover opacity-80">
            </div>
            <div class="w-full md:w-1/2 p-8 md:p-10 flex flex-col">
                <div class="flex justify-between items-start mb-4">
                    <h2 id="modal-titulo" class="text-2xl font-black tracking-tight"></h2>
                    <button onclick="cerrarModal()" class="text-slate-500 hover:text-white text-3xl leading-none">&times;</button>
                </div>
                <p id="modal-descripcion" class="text-slate-400 text-sm mb-6 leading-relaxed"></p>
                <div class="bg-slate-900/50 p-6 rounded-[2rem] border border-white/5 mb-8">
                    <p id="modal-detalles" class="text-slate-500 text-xs mono italic"></p>
                </div>
                <div class="mt-auto space-y-3">
                    <a id="modal-download" target="_blank" class="block w-full text-center bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold text-xs uppercase tracking-widest transition-all">Descargar</a>
                    <a id="modal-link" target="_blank" class="block w-full text-center border border-slate-700 py-4 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-slate-800 transition-all">Source Code</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let db = [];

        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            const isOpen = !menu.classList.contains('-translate-x-full');
            menu.classList.toggle('-translate-x-full');
            icon.innerHTML = isOpen ? '<path d="M3 12h18M3 6h18M3 18h18"/>' : '<path d="M18 6L6 18M6 6l12 12"/>';
        }

        async function load() {
            try {
                const r = await fetch('proyectos.json?v=' + Date.now());
                db = await r.json();
                render(db.reverse());
                updateStatus();
            } catch (e) { console.error(e); }
        }

        async function updateStatus() {
            try {
                const r = await fetch('status.json?v=' + Date.now());
                const s = await r.json();
                const box = document.getElementById('status-box');
                const txt = document.getElementById('status-text');
                txt.innerText = s.estado;
                txt.style.color = s.color;
                box.style.borderColor = s.color + '44';
            } catch(e){}
        }

        function render(lista) {
            const cont = document.getElementById('contenedor-proyectos');
            document.getElementById('count').innerText = lista.length;
            cont.innerHTML = lista.map(p => `
                <div class="glass-panel rounded-[2.5rem] hover:border-blue-500/50 transition-all cursor-pointer group overflow-hidden" onclick='abrirModal(${JSON.stringify(p)})'>
                    <div class="h-48 overflow-hidden relative border-b border-white/5">
                        <img src="${p.miniatura}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-500">
                    </div>
                    <div class="p-8">
                        <h3 class="text-xl font-black mb-2 group-hover:text-blue-400 transition-colors">${p.titulo}</h3>
                        <p class="text-slate-500 text-xs line-clamp-2 leading-relaxed">${p.descripcion}</p>
                    </div>
                </div>
            `).join('');
        }

        function filtrar() {
            const q = document.getElementById('buscador').value.toLowerCase();
            render(db.filter(p => p.titulo.toLowerCase().includes(q) || p.descripcion.toLowerCase().includes(q)));
        }

        function abrirModal(p) {
            document.getElementById('modal-titulo').innerText = p.titulo;
            document.getElementById('modal-descripcion').innerText = p.descripcion;
            document.getElementById('modal-detalles').innerText = p.detalles;
            document.getElementById('modal-captura').src = p.captura;
            document.getElementById('modal-download').href = p.download;
            document.getElementById('modal-link').href = p.link;
            document.getElementById('modal').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }
        load();
        setInterval(updateStatus, 30000);
    </script>
</body>
</html>
